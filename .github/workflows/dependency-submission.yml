name: Submit Gradle dependencies

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aerodrive-dependencies-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency graph with Gradle 8.13
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Install the pinned SDK components
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Generate and submit the dependency graph
        uses: gradle/actions/dependency-submission@v4
        with:
          # Explicit selection also works before the wrapper is committed.
          gradle-version: '8.13'
          build-root-directory: '.'
          additional-arguments: --no-daemon --no-configuration-cache --stacktrace
